spring:
  application:
    name: ivi

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ivi}
    username: ${DB_USERNAME:ivi}
    password: ${DB_PASSWORD:ivi}

  jpa:
    # Schema is owned by Flyway. Hibernate validates against it and never writes it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Turns the plan aggregate's nested collections from an N+1 into one query per level.
        # A week-long plan is plan -> 7 days -> ~35 meals -> ~140 items; without this each
        # meal and each item list is fetched individually.
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    # Nulls are serialised rather than omitted. Several DTOs use null as a meaningful value —
    # outOfRange is null when a measurement type defines no reference range, foodId is null once
    # a food has been deleted — and dropping the key makes that indistinguishable from a field
    # the client's version does not know about.
    default-property-inclusion: always

  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      # Schema is created by Flyway (V2). Spring must not attempt its own DDL.
      initialize-schema: never

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        # Overridden to true wherever the app is served over TLS.
        secure: ${COOKIE_SECURE:false}
        same-site: lax
  error:
    # Errors are shaped by GlobalExceptionHandler; the default whitelabel page leaks detail.
    whitelabel:
      enabled: false
  compression:
    enabled: true

ivi:
  security:
    # How many X-Forwarded-For entries were appended by proxies we control, counting from the
    # right. Zero means the header is not believed at all and the socket address is used.
    #
    # A deployment behind a load balancer MUST set this — behind one, it is 1. Left at zero there,
    # every request looks like it came from the balancer and the per-address login limit stops
    # telling callers apart. It degrades safely rather than dangerously: the per-email limit is
    # what actually protects an account, and that one cannot be spoofed at all.
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}

  http-logging:
    enabled: true
    # Bodies carry names, weights, blood markers and clinical notes — Article 9 data — and on the
    # auth endpoints, passwords. Enabling this copies the health record into the log stream, which
    # has different retention and access control from the database. Local development against
    # fabricated data only.
    include-bodies: ${HTTP_LOG_BODIES:false}
    max-body-chars: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Never expose internal component detail publicly.
      show-details: never
