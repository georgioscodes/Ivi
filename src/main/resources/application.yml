spring:
  application:
    name: ivi

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ivi}
    username: ${DB_USERNAME:ivi}
    password: ${DB_PASSWORD:ivi}

  jpa:
    # Schema is owned by Flyway. Hibernate validates against it and never writes it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Turns the plan aggregate's nested collections from an N+1 into one query per level.
        # A week-long plan is plan -> 7 days -> ~35 meals -> ~140 items; without this each
        # meal and each item list is fetched individually.
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      # Schema is created by Flyway (V2). Spring must not attempt its own DDL.
      initialize-schema: never

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        # Overridden to true wherever the app is served over TLS.
        secure: ${COOKIE_SECURE:false}
        same-site: lax
  error:
    # Errors are shaped by GlobalExceptionHandler; the default whitelabel page leaks detail.
    whitelabel:
      enabled: false
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Never expose internal component detail publicly.
      show-details: never
