spring:
  application:
    name: ivi

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ivi}
    username: ${DB_USERNAME:ivi}
    password: ${DB_PASSWORD:ivi}

  jpa:
    # Schema is owned by Flyway. Hibernate validates against it and never writes it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    # Errors are shaped by GlobalExceptionHandler; the default whitelabel page leaks detail.
    whitelabel:
      enabled: false
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Never expose internal component detail publicly.
      show-details: never
